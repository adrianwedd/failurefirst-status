name: Response Time CI
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
# Serialize all generated-history writers; never interrupt an active monitor.
concurrency:
  group: upptime-main-writers
  cancel-in-progress: false
  queue: max
permissions:
  contents: write
jobs:
  response-time:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Resolve the branch tip after acquiring the shared writer lock.
          ref: ${{ github.ref_name }}
      - uses: upptime/uptime-monitor@v1.43.12
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
